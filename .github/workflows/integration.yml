name: Integration

on:
  pull_request:
    paths: ['src/shared/infrastructure/**']
  schedule:
    - cron: '0 4 * * 1'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the narrow integration tests
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            exec pnpm test:integration
          fi
          for attempt in 1 2 3; do
            if pnpm test:integration; then
              if [ "$attempt" != '1' ]; then
                echo "::warning::integration passed on attempt $attempt"
              fi
              exit 0
            fi
            echo "attempt $attempt failed"
          done
          exit 1
