name: Mutation

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions: {}

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  INCREMENTAL_FILE: reports/mutation/incremental.json

jobs:
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cdn.playwright.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the incremental results of the last run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INCREMENTAL_FILE }}
          key: stryker-${{ github.sha }}
          restore-keys: stryker-
      - name: Run Stryker when src holds a module to mutate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mutable=$(git ls-files src | grep -E '\.tsx?$' \
            | grep -vE '\.(test|spec)\.tsx?$|\.integration\.ts$|^src/app/main\.tsx$' || true)
          if [ -z "$mutable" ]; then
            echo 'src has no module to mutate yet'
            exit 0
          fi
          rebuild=''
          if [ "$EVENT" != 'pull_request' ]; then
            rebuild='--force'
          fi
          pnpm test:mutation \
            --incremental \
            --incrementalFile "$INCREMENTAL_FILE" \
            $rebuild
