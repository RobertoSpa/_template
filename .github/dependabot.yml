version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # These packages change the output. Their pull request needs pnpm bundle:write. Rule BSOT-05.
      bundle:
        patterns:
          - '@vitejs/plugin-react'
          - react
          - react-dom
          - vite
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint stays at 9 until eslint-config-canonical accepts 10.
      - dependency-name: eslint
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
