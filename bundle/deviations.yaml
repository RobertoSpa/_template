# One record per deviation from a required rule. Rule BDEV-01 in docs/agents/bundle.md.
#
# A record has the seven fields of Rule DEV-01 in docs/agents/security.md. The
# field place names one route, such as /settings, one file of bundle/sizes.json,
# such as assets/index.js, or one key of bundle/policy.yaml. A mandatory rule
# takes no record.
- rule: BSOT-04
  place: files.data.rule
  rationale: Issue 30 adds the key rule to each file group, so the size gate reads the rule of a group from the policy and not from its name.
  risk: The key is new and has no safe direction. A wrong value gives a file the wrong rule, and the policy gate refuses each value except BUD-05 and BUD-06.
  approver: RobertoSpa
  date: '2026-09-26'
  expiry: '2026-10-26'
